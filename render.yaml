# Render Blueprint — deploys backend (Docker), frontend (static) and Postgres
# together. On Render: New -> Blueprint -> pick this repository.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: taskboard-db
    plan: free
    databaseName: taskboard
    user: taskboard

services:
  - type: web
    name: taskboard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskboard-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "4000"

  - type: web
    name: taskboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://taskboard-backend-ofu4.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
